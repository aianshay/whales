<style>
  :root {
    color-scheme: light dark;
    --g-paper:  #E7EAE3;
    --g-card:   #F3F5EF;
    --g-ink:    #10222B;
    --g-ink-2:  #3E5761;
    --g-ink-3:  #6E8189;
    --g-line:   #C4CCC0;
    --g-deep:   #14535E;
    --g-shoal:  #4C929A;
    --g-alert:  #A82760;
    --g-field:  #FFFFFF;
    --g-shadow: 0 1px 0 rgba(16,34,43,.05), 0 18px 40px -24px rgba(16,34,43,.45);
    --g-display: "Avenir Next Condensed", "Avenir Next", "Helvetica Neue", Helvetica, sans-serif;
    --g-body: "Iowan Old Style", "Charter", "Palatino Linotype", Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --g-paper:#08151A; --g-card:#0E1F26; --g-ink:#DDE8E6; --g-ink-2:#9CB3B6;
      --g-ink-3:#6E888D; --g-line:#234049; --g-deep:#63BBC0; --g-shoal:#37767F;
      --g-alert:#EE7AAB; --g-field:#132C34;
      --g-shadow: 0 1px 0 rgba(0,0,0,.3), 0 18px 40px -24px rgba(0,0,0,.8);
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--g-paper); color: var(--g-ink); font-family: var(--g-body); }
  img { max-width: 100%; }

  #gate {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; background: var(--g-paper);
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%; max-width: 372px;
    background: var(--g-card); border: 1px solid var(--g-line);
    border-radius: 14px; padding: 34px 30px 28px;
    box-shadow: var(--g-shadow); text-align: center;
  }
  .mark { display: block; margin: 0 auto 20px; width: 76px; height: auto; color: var(--g-deep); }
  .eyebrow {
    font-family: var(--g-display); font-size: 11px; font-weight: 600;
    letter-spacing: .16em; text-transform: uppercase; color: var(--g-shoal);
    margin: 0 0 7px;
  }
  h1 {
    font-family: var(--g-display); font-size: 27px; font-weight: 600;
    letter-spacing: -.01em; margin: 0 0 6px; color: var(--g-ink);
  }
  .datas {
    font-family: var(--g-display); font-size: 12px; font-weight: 600;
    letter-spacing: .13em; text-transform: uppercase; color: var(--g-ink-3);
    margin: 0 0 18px;
  }
  .sub { font-size: 14.5px; line-height: 1.5; color: var(--g-ink-2); margin: 0 0 22px; }

  form { display: flex; flex-direction: column; gap: 10px; }
  input {
    width: 100%; font-family: var(--g-display); font-size: 22px; font-weight: 600;
    letter-spacing: .34em; text-align: center; text-indent: .34em;
    padding: 13px 12px; border-radius: 9px;
    border: 1px solid var(--g-line); background: var(--g-field); color: var(--g-ink);
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  input:focus { border-color: var(--g-shoal); box-shadow: 0 0 0 3px color-mix(in srgb, var(--g-shoal) 22%, transparent); }
  input::placeholder { color: var(--g-ink-3); letter-spacing: .34em; font-weight: 400; }
  button {
    font-family: var(--g-display); font-size: 14px; font-weight: 600;
    letter-spacing: .07em; text-transform: uppercase;
    padding: 13px 12px; border: 0; border-radius: 9px; cursor: pointer;
    background: var(--g-deep); color: var(--g-paper);
    transition: opacity .15s, transform .06s;
  }
  button:hover { opacity: .9; }
  button:active { transform: translateY(1px); }
  button[disabled] { opacity: .55; cursor: default; transform: none; }

  .msg {
    min-height: 18px; margin-top: 13px; font-size: 13px; line-height: 1.45;
    color: var(--g-alert); font-family: var(--g-display); letter-spacing: .02em;
  }
  .msg.calm { color: var(--g-ink-3); }

  .shake { animation: shake .34s; }
  @keyframes shake {
    10%, 90% { transform: translateX(-2px); }
    30%, 70% { transform: translateX(4px); }
    50%      { transform: translateX(-5px); }
  }
  @media (prefers-reduced-motion: reduce) { .shake { animation: none; } }
</style>

(function () {

  var campo  = document.getElementById("pw");
  var botao  = document.getElementById("go");
  var msg    = document.getElementById("msg");

  function bytes(b64) {
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function aviso(texto, calmo) {
    msg.textContent = texto;
    msg.className = calmo ? "msg calm" : "msg";
  }

      "raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveKey"]

      { name: "PBKDF2", salt: bytes(dados.s), iterations: dados.n, hash: "SHA-256" },

    );
    var claro = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: bytes(dados.i) }, chave, bytes(dados.c)
    );
    return new TextDecoder().decode(claro);
  }

  function mostrar(htmlTexto) {
    gate.remove();
    var alvo = document.createElement("div");
    alvo.innerHTML = htmlTexto;
    document.body.appendChild(alvo);
    // innerHTML nao executa <script>: recria cada um para rodar de verdade.
    alvo.querySelectorAll("script").forEach(function (velho) {
      var novo = document.createElement("script");
      for (var i = 0; i < velho.attributes.length; i++) {
        novo.setAttribute(velho.attributes[i].name, velho.attributes[i].value);
      }
      novo.textContent = velho.textContent;
      velho.parentNode.replaceChild(novo, velho);
    });
  }

  var ocupado = false;

  async function tentar(senha, silencioso) {
    if (ocupado || !senha) return;
    ocupado = true;
    botao.disabled = true;
    aviso("Abrindo…", true);
    try {
      var conteudo = await abrir(senha);
      try { sessionStorage.setItem(CHAVE_SESSAO, senha); } catch (e) {}
      mostrar(conteudo);
    } catch (e) {
      try { sessionStorage.removeItem(CHAVE_SESSAO); } catch (e2) {}
      ocupado = false;
      botao.disabled = false;
      campo.value = "";
      if (silencioso) { aviso(""); }
      else {
        aviso("Senha incorreta.");
        card.classList.remove("shake");
        void card.offsetWidth;
        card.classList.add("shake");
      }
      campo.focus();
    }
  }

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    tentar(campo.value.trim(), false);
  });

  campo.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter") { ev.preventDefault(); tentar(campo.value.trim(), false); }
  });

  campo.addEventListener("input", function () {
    if (msg.textContent && !msg.classList.contains("calm")) aviso("");
  });

  var guardada = null;
  try { guardada = sessionStorage.getItem(CHAVE_SESSAO); } catch (e) {}
  if (guardada) tentar(guardada, true);
  else campo.focus();
})();
</script>
